name: Snake Animation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: sooyeol2g
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0a0a0d&color_dots=#ebebef,#c4c3cc,#8f8d9b,#58575f,#0a0a0d
            dist/github-contribution-grid-snake-dark.svg?color_snake=#f3f2f6&color_dots=#131318,#2a2a32,#58575f,#9c9aa6,#f3f2f6

      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist
          git diff --staged --quiet && exit 0
          git commit -m "chore: update snake animation"
          git push
